# CI: verify everything on every push and PR, split into parallel jobs
# so failures surface fast and independently. Test jobs run as a
# matrix (package × Node version); coverage is report-only.
# Docker images are built (not pushed) here so Dockerfile breakage
# fails the PR; pushing to GHCR happens in release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Coverage ratchet comment (issue #42) upserts a sticky issue comment.
    # Scoped grants only: job-level permissions deny everything not listed,
    # and the step needs contents/read (checkout on private repos) and
    # actions/read (gh run download from the main branch's run).
    permissions:
      issues: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        package: [server, web]
        node: [22, 24]
        exclude:
          # Web is plain Next.js; one Node version is enough.
          - package: web
            node: 24
        include:
          # Report-only coverage on the primary server run.
          - package: server
            node: 22
            coverage: true
    name: tests (${{ matrix.package }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @polymer/${{ matrix.package }} test
      - run: pnpm --filter @polymer/server exec vitest run --coverage
        if: matrix.coverage == true
      # Coverage ratchet (issue #42): main runs record the json-summary
      # as an artifact; PR runs diff against it and upsert a sticky
      # comment. Visibility only — no threshold, never fails (issue #27).
      - uses: actions/upload-artifact@v5
        if: matrix.coverage == true && github.event_name == 'push'
        with:
          name: coverage-summary-main
          path: apps/server/coverage/coverage-summary.json
      - name: coverage delta comment
        if: matrix.coverage == true && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          gh run download "$(gh run list -w ci -b main -s success -L 1 --json databaseId --jq '.[0].databaseId')" \
            -n coverage-summary-main -D /tmp/coverage-baseline \
            || echo "no main baseline artifact yet — totals-only comment"
          node scripts/coverage-delta.mjs \
            --current apps/server/coverage/coverage-summary.json \
            --baseline /tmp/coverage-baseline/coverage-summary.json \
            --pr "$PR_NUMBER" || echo "coverage comment skipped (visibility only)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: e2e (fleet)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:fleet

  # Browser smoke for the admin console (issue #43): its own job, not
  # the tests matrix, so the slow Playwright browser download never
  # gates unit-test feedback. No artifacts uploaded on purpose: a
  # saved trace would contain the master credential and the minted
  # OTP; the list reporter plus fixture stderr tails are the evidence.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e (web smoke)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @polymer/web exec playwright install chromium --with-deps
      - run: pnpm e2e:web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    name: docker (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
