# Release: publish images to GHCR. Merges to main push :latest +
# :sha; version tags (v*) push those plus :<version>. No registry
# credentials to manage: GITHUB_TOKEN already has packages:write.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: polymer-server
            dockerfile: apps/server/Dockerfile
          - name: polymer-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy: pull the just-published :latest onto the fleet host. One
  # behavior of issue #76: a merge to main ends with the host running
  # those images — no human deploy step. Main merges only: a v* tag
  # push must not redeploy a stale (previous) :latest, because
  # metadata-action does not push :latest for tags. Job is a no-op
  # until the DEPLOY_* secrets exist, so CI stays green before the
  # host is set up. No credentials to mint beyond one SSH key for the
  # host; the host needs bash + docker compose (provisioning itself is
  # out of scope — see issue #76).
  deploy:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on secrets
        id: gate
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -o pipefail
          if [ -n "${DEPLOY_SSH_HOST:-}" ] && [ -n "${DEPLOY_SSH_USER:-}" ] \
            && [ -n "${DEPLOY_SSH_KEY:-}" ] && [ -n "${DEPLOY_DIR:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false (deploy secrets not set; skipping)" >> "$GITHUB_OUTPUT"
          fi
      - name: Compose pull + up on the host
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          key="$(mktemp)"; trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"; chmod 600 "$key"
          ssh_key_arg=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          # The deploy dir is passed as a positional arg to `bash -s`,
          # never interpolated into the remote command text; the
          # single-quoted heredoc guarantees no local expansion.
          ssh "${ssh_key_arg[@]}" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" 'bash -s' -- "$DEPLOY_DIR" <<'REMOTE'
            set -euo pipefail
            cd "$1"
            docker compose pull
            docker compose up -d --remove-orphans
            # Drop only this project's dangling (replaced :sha) images.
            # Never prune other workloads' images on a shared host.
            docker image ls -f dangling=true --format '{{.Repository}} {{.ID}}' \
              | awk '$1 ~ /^ghcr.io\/sectersion\// {print $2}' \
              | xargs -r docker rmi
          REMOTE
