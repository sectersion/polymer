# Release: publish images to GHCR. Merges to main push :latest +
# :sha; version tags (v*) push those plus :<version>. No registry
# credentials to manage: GITHUB_TOKEN already has packages:write.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: polymer-server
            dockerfile: apps/server/Dockerfile
          - name: polymer-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploy: pull the just-published :latest onto the fleet host. One
  # behavior of issue #76: a merge to main ends with the host running
  # those images — no human deploy step. Main merges only: a v* tag
  # push must not redeploy a stale (previous) :latest, because
  # metadata-action does not push :latest for tags. Job is a no-op
  # until the DEPLOY_* secrets exist, so CI stays green before the
  # host is set up. The deploy job now also carries DEPLOY_SSH_HOST_KEY
  # (#81) so an unpinned host key can't be silently accepted. No
  # credentials to mint beyond one SSH key + the host's key line
  # (ssh-keyscan, see #76); the host needs curl, bash + docker compose
  # (provisioning itself is out of scope — see issue #76).
  deploy:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on secrets
        id: gate
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -o pipefail
          if [ -n "${DEPLOY_SSH_HOST:-}" ] && [ -n "${DEPLOY_SSH_USER:-}" ] \
            && [ -n "${DEPLOY_SSH_KEY:-}" ] && [ -n "${DEPLOY_DIR:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false (deploy secrets not set; skipping)" >> "$GITHUB_OUTPUT"
          fi
      - name: Compose pull + up on the host
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Host-key pinning (#81): when DEPLOY_SSH_HOST_KEY is set the
          # connection verifies against that key only — a changed host
          # key fails the deploy instead of being silently accepted.
          # Until the key is captured (ssh-keyscan on the host after
          # first connect — see #76), fall back to trust-on-first-use
          # with a loud warning; the invariant "never trusts an
          # unpinned host" is fully in force only once the secret is
          # set, and that gap is logged loudly here.
          key="$(mktemp)"; kh="$(mktemp)"
          trap 'rm -f "$key" "$kh"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"; chmod 600 "$key"
          ssh_key_arg=(-i "$key" -o BatchMode=yes)
          if [ -n "${DEPLOY_SSH_HOST_KEY:-}" ]; then
            printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_SSH_HOST_KEY" > "$kh"
            ssh_key_arg+=(-o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$kh" -o StrictHostKeyChecking=yes)
          else
            echo "WARNING: DEPLOY_SSH_HOST_KEY not set — using trust-on-first-use (accept-new); run ssh-keyscan on the host and set the secret (see #76)" >&2
            ssh_key_arg+=(-o StrictHostKeyChecking=accept-new)
          fi
          # The deploy dir is passed as a positional arg to `bash -s`,
          # never interpolated into the remote command text; the
          # single-quoted heredoc guarantees no local expansion.
          ssh "${ssh_key_arg[@]}" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" 'bash -s' -- "$DEPLOY_DIR" <<'REMOTE'
            set -euo pipefail
            cd "$1"
            docker compose pull
            docker compose up -d --remove-orphans
            # Health-gate (#80): the deploy succeeds only when the
            # freshly pulled server answers /health on its published
            # loopback port (compose maps 127.0.0.1:8080). A broken
            # server must finish as a red job, not a green one.
            command -v curl >/dev/null || { echo "deploy failed: curl is required on the host" >&2; exit 1; }
            deadline=$((SECONDS + 60))
            until curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "deploy failed: server not healthy within 60s" >&2
                docker compose ps >&2
                docker compose logs --tail 50 >&2
                exit 1
              fi
              sleep 2
            done
            echo "deploy healthy: $(curl -fsS http://127.0.0.1:8080/health)"
            # Drop only this project's dangling (replaced :sha) images.
            # Never prune other workloads' images on a shared host.
            docker image ls -f dangling=true --format '{{.Repository}} {{.ID}}' \
              | awk '$1 ~ /^ghcr.io\/sectersion\// {print $2}' \
              | xargs -r docker rmi
          REMOTE

  # Release (#87): on a v* tag, publish a GitHub Release whose notes
  # are the squash-merge subjects since the previous v* tag, grouped
  # by the subject prefixes in force (feat: → Added, fix:/audit: →
  # Fixed, anything else → Internal). Notes live on the Release
  # object only — nothing is committed back to main, because main
  # moves only by PR merge (working agreement). Runs after images so
  # the tag's :version image tags exist by the time the Release is
  # cut.
  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release with notes from squash subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "release failed: tag '$tag' is not vX.Y.Z" >&2; exit 1; }
          prev="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -vx "$tag" | sort -V | tail -1 || true)"
          if [ -n "$prev" ]; then
            range="refs/tags/$prev..HEAD"
          else
            first="$(git rev-list --max-parents=0 HEAD | head -1)"
            range="$first..HEAD"
          fi
          prefix="https://github.com/${GITHUB_REPOSITORY}"
          added="$(mktemp)"; fixed="$(mktemp)"; internal="$(mktemp)"; notes="$(mktemp)"
          trap 'rm -f "$added" "$fixed" "$internal" "$notes"' EXIT
          git log --format='%s' "$range" | sort -u | while IFS= read -r subj; do
            case "$subj" in
              feat:*)         printf '%s\n' "$subj" >> "$added" ;;
              fix:*|audit:*)  printf '%s\n' "$subj" >> "$fixed" ;;
              *)              printf '%s\n' "$subj" >> "$internal" ;;
            esac
          done
          emit() {
            if [ -s "$2" ]; then
              printf '### %s\n\n' "$1" >> "$notes"
              sed -E "s|#([0-9]+)|[#\1](${prefix}/pull/\1)|g" "$2" | sed 's/^/- /' >> "$notes"
              printf '\n' >> "$notes"
            fi
          }
          emit "Added" "$added"
          emit "Fixed" "$fixed"
          if [ -s "$internal" ]; then
            # Internal churn is stated, not hidden — but only as a count
            # collapsed behind the compare link, never claiming novelty.
            printf '### Internal\n\n- %d internal/docs/chore commits (see compare link below)\n\n' \
              "$(wc -l < "$internal")" >> "$notes"
          fi
          if [ -n "$prev" ]; then
            printf '**Full changelog:** %s/compare/%s...%s\n' "$prefix" "$prev" "$tag" >> "$notes"
          fi
          gh release create "$tag" --verify-tag \
            --title "Polymer $tag" --notes-file "$notes"
